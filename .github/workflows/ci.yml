name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 安装与启动回归验证
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    # 用例内部会调用子进程，结束时 LASTEXITCODE 可能残留非零值；
    # 每个步骤在用例正常返回后重置为 0，用例抛出的错误仍会让步骤失败。
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示运行环境
        shell: powershell
        run: |
          Write-Host "Windows PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "系统版本: $([Environment]::OSVersion.VersionString)"
          Write-Host "系统 ANSI 代码页: $((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage').ACP)"
          # GitHub 托管的 Windows 运行器是英文系统（ANSI 代码页 1252）。
          # WScript.Shell 在该代码页下无法创建中文名快捷方式，因此依赖
          # 中文快捷方式的用例留到本地中文 Windows 上运行。
          $global:LASTEXITCODE = 0

      - name: 打包发布包
        shell: powershell
        run: |
          .\scripts\package-release.ps1
          $global:LASTEXITCODE = 0

      - name: 配置、备份与进程隔离回归
        shell: powershell
        run: |
          .\tests\test-regressions.ps1
          $global:LASTEXITCODE = 0

      - name: 启动器复用与失败传播
        shell: powershell
        run: |
          .\tests\test-launcher.ps1
          $global:LASTEXITCODE = 0

      - name: 无按键安装入口
        shell: powershell
        run: |
          .\tests\test-unattended.ps1
          $global:LASTEXITCODE = 0

      - name: 入口脚本与错误日志
        shell: powershell
        run: |
          .\tests\test-bootstrap.ps1 -HeadlessRunner
          $global:LASTEXITCODE = 0

      - name: 隐藏控制台模式
        shell: powershell
        run: |
          .\tests\test-console-mode.ps1
          $global:LASTEXITCODE = 0

      - name: 复制失败与完整性校验
        shell: powershell
        run: |
          .\tests\test-copy-failures.ps1
          $global:LASTEXITCODE = 0

      - name: 自定义安装位置识别
        shell: powershell
        run: |
          .\tests\test-discovery.ps1
          $global:LASTEXITCODE = 0

      - name: 商店版查找兜底与磁盘预检
        shell: powershell
        run: |
          .\tests\test-store-fallback.ps1
          $global:LASTEXITCODE = 0

      - name: BAT 入口必须为 CRLF
        shell: powershell
        run: |
          $bad = Get-ChildItem -Recurse -Include *.bat,*.vbs | Where-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            for ($i = 0; $i -lt $b.Length; $i++) { if ($b[$i] -eq 10 -and ($i -eq 0 -or $b[$i-1] -ne 13)) { return $true } }
            $false
          }
          if ($bad) { throw "LF-only line endings: $($bad.FullName -join ', ')" }

      - name: 失败时上传诊断文件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: diagnostics/**
          if-no-files-found: ignore

  # 可选：维护者上传真实 MSIX（例如 Release 附件或内部存储）后手动触发，
  # 对真实 app.asar 执行渲染组件对照、补丁和完整性校验。
  real-package:
    name: 真实 Codex 安装包审计
    if: github.event_name == 'workflow_dispatch' && vars.CODEX_MSIX_URL != ''
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 下载并解出 app.asar
        shell: powershell
        run: |
          Invoke-WebRequest -Uri '${{ vars.CODEX_MSIX_URL }}' -OutFile codex.msix
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path codex.msix))
          try {
            $entry = $zip.Entries | Where-Object FullName -eq 'app/resources/app.asar'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$PWD\app.asar", $true)
          } finally { $zip.Dispose() }
      - name: 官方中文资源审计
        run: node scripts/analyze-codex-asar.mjs app.asar
      - name: 翻译开关对照与补丁完整性
        run: python tests/test-locale-gate.py app.asar
