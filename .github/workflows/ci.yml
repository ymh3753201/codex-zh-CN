name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 安装与启动回归验证
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示运行环境
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          Write-Host "Windows PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "系统版本: $([Environment]::OSVersion.VersionString)"

      - name: 快捷方式环境诊断
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          Write-Host "OutputEncoding=$([Console]::OutputEncoding.WebName) ACP=$((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage').ACP)"
          Write-Host "Culture=$([Globalization.CultureInfo]::CurrentCulture.Name) UI=$([Globalization.CultureInfo]::CurrentUICulture.Name)"
          Write-Host "env:TEMP=$env:TEMP"
          Write-Host "GetTempPath=$([IO.Path]::GetTempPath())"
          $cjk = [string]([char]0x4E2D) + [char]0x6587 + [char]0x7248
          Write-Host "cjk codepoints=$(($cjk.ToCharArray() | ForEach-Object { [int]$_ }) -join ',')"
          $probe = Join-Path $env:TEMP 'lnk-probe2'
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          $notepad = Join-Path $env:SystemRoot 'System32\notepad.exe'
          $shell = New-Object -ComObject WScript.Shell
          # case 1: plain ascii shortcut
          try {
            $l = $shell.CreateShortcut((Join-Path $probe 'ascii-probe.lnk'))
            $l.TargetPath = $notepad
            $l.Save()
            Write-Host "[CASE1 OK] ascii shortcut saved"
          } catch { Write-Host "[CASE1 FAIL] $($_.Exception.Message)" }
          # case 2: real CJK filename, built from code points
          try {
            $cjkPath = Join-Path $probe ('Codex ' + $cjk + '.lnk')
            $l = $shell.CreateShortcut($cjkPath)
            $l.TargetPath = $notepad
            $l.Save()
            Write-Host "[CASE2 OK] cjk shortcut saved, exists=$([IO.File]::Exists($cjkPath))"
          } catch { Write-Host "[CASE2 FAIL] $($_.Exception.Message)" }
          # case 3: plain file with the same CJK name, to separate WSH from the filesystem
          try {
            $cjkFile = Join-Path $probe ('Codex ' + $cjk + '.txt')
            [IO.File]::WriteAllText($cjkFile, 'probe')
            Write-Host "[CASE3 OK] cjk plain file written, exists=$([IO.File]::Exists($cjkFile))"
          } catch { Write-Host "[CASE3 FAIL] $($_.Exception.Message)" }
          # case 4: cjk shortcut under a nested dir (mimics the test layout)
          try {
            $nested = Join-Path $probe 'nested\desktop'
            New-Item -ItemType Directory -Path $nested -Force | Out-Null
            $cjkPath = Join-Path $nested ('Codex ' + $cjk + '.lnk')
            $l = $shell.CreateShortcut($cjkPath)
            $l.TargetPath = $notepad
            $l.Save()
            Write-Host "[CASE4 OK] nested cjk shortcut saved, exists=$([IO.File]::Exists($cjkPath))"
          } catch { Write-Host "[CASE4 FAIL] $($_.Exception.Message)" }
          Get-ChildItem -LiteralPath $probe -Recurse | ForEach-Object { Write-Host "  probe entry: $($_.FullName)" }

      - name: 打包发布包
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\scripts\package-release.ps1

      - name: 安装主流程、复制补丁与语言恢复
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-workflow.ps1

      - name: 旧版长路径与只读属性
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-workflow.ps1 -LegacyLongPaths

      - name: 配置、备份与进程隔离回归
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-regressions.ps1

      - name: 启动器复用与失败传播
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-launcher.ps1

      - name: 无按键安装入口
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-unattended.ps1

      - name: 入口脚本与错误日志
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-bootstrap.ps1

      - name: 隐藏控制台模式
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-console-mode.ps1

      - name: 复制失败与完整性校验
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-copy-failures.ps1

      - name: 自定义安装位置识别
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-discovery.ps1

      - name: 发布包解包回归
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-release.ps1

      - name: 失败时上传诊断文件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: diagnostics/**
          if-no-files-found: ignore
