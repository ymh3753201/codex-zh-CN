name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 安装与启动回归验证
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    # 用例内部会调用子进程，结束时 LASTEXITCODE 可能残留非零值；
    # 每个步骤在用例正常返回后重置为 0，用例抛出的错误仍会让步骤失败。
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示运行环境
        shell: powershell
        run: |
          Write-Host "Windows PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "系统版本: $([Environment]::OSVersion.VersionString)"
          Write-Host "系统 ANSI 代码页: $((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage').ACP)"
          # 中文快捷方式使用 Unicode 接口，英文系统也要验证中文路径。
          $global:LASTEXITCODE = 0

      - name: 打包发布包
        shell: powershell
        run: |
          .\scripts\package-release.ps1
          $global:LASTEXITCODE = 0

      - name: 配置、备份与进程隔离回归
        shell: powershell
        run: |
          .\tests\test-regressions.ps1
          $global:LASTEXITCODE = 0

      - name: 启动器复用与失败传播
        shell: powershell
        run: |
          .\tests\test-launcher.ps1
          $global:LASTEXITCODE = 0

      - name: 无按键安装入口
        shell: powershell
        run: |
          .\tests\test-unattended.ps1
          $global:LASTEXITCODE = 0

      - name: 入口脚本与错误日志
        shell: powershell
        run: |
          .\tests\test-bootstrap.ps1 -HeadlessRunner
          $global:LASTEXITCODE = 0

      - name: 隐藏控制台模式
        shell: powershell
        run: |
          .\tests\test-console-mode.ps1
          $global:LASTEXITCODE = 0

      - name: 复制失败与完整性校验
        shell: powershell
        run: |
          .\tests\test-copy-failures.ps1
          $global:LASTEXITCODE = 0

      - name: 自定义安装位置识别
        shell: powershell
        run: |
          .\tests\test-discovery.ps1
          $global:LASTEXITCODE = 0

      - name: 商店版查找兜底与磁盘预检
        shell: powershell
        run: |
          .\tests\test-store-fallback.ps1
          $global:LASTEXITCODE = 0

      - name: 完整安装流程（中文路径、快捷方式、旧式长路径）
        shell: powershell
        run: |
          .\tests\test-workflow.ps1
          .\tests\test-workflow.ps1 -LegacyLongPaths
          $global:LASTEXITCODE = 0

      - name: BAT 入口必须为 CRLF
        shell: powershell
        run: |
          $bad = Get-ChildItem -Recurse -Include *.bat,*.vbs | Where-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            for ($i = 0; $i -lt $b.Length; $i++) { if ($b[$i] -eq 10 -and ($i -eq 0 -or $b[$i-1] -ne 13)) { return $true } }
            $false
          }
          if ($bad) { throw "LF-only line endings: $($bad.FullName -join ', ')" }

      - name: PowerShell 编码与语法
        shell: powershell
        run: |
          foreach ($file in @(Get-ChildItem scripts,tests -Recurse -Filter *.ps1)) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            if (($bytes[0..2] -join ',') -ne '239,187,191') { throw "Missing UTF-8 BOM: $($file.FullName)" }
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }

      - name: 发布 ZIP 校验与安装回归
        shell: powershell
        run: |
          .\tests\test-release.ps1 -HeadlessRunner -SkipInstalledAppTests
          $global:LASTEXITCODE = 0

      - name: 界面语言检查的成功与失败判定
        shell: powershell
        run: |
          node tests/test-cdp-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'CDP checker regression failed' }

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: codex-zh-CN-release
          path: dist/codex-zh-CN-v*.zip
          if-no-files-found: error

      - name: 失败时上传诊断文件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: diagnostics/**
          if-no-files-found: ignore
