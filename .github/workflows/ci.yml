name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 安装与启动回归验证
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示运行环境
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          Write-Host "Windows PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "系统版本: $([Environment]::OSVersion.VersionString)"

      - name: 快捷方式环境诊断
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          Write-Host "OutputEncoding=$([Console]::OutputEncoding.WebName) InputEncoding=$([Console]::InputEncoding.WebName)"
          Write-Host "ACP=$((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage' -ErrorAction SilentlyContinue).ACP)"
          $name = 'Codex 中文版.lnk'
          Write-Host ("非 ASCII 文件名码点: " + (($name.ToCharArray() | ForEach-Object { [int]$_ }) -join ','))
          $probe = Join-Path $env:TEMP 'lnk-probe'
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          $shell = New-Object -ComObject WScript.Shell
          foreach ($candidate in @('plain-probe.lnk', $name)) {
            $path = Join-Path $probe $candidate
            $link = $shell.CreateShortcut($path)
            $link.TargetPath = Join-Path $env:SystemRoot 'System32\notepad.exe'
            try {
              $link.Save()
              Write-Host "[OK] $candidate 创建成功，存在=$([IO.File]::Exists($path))"
            } catch {
              Write-Host "[FAIL] $candidate -> $($_.Exception.Message)"
            }
          }
          Write-Host "临时目录: $probe"

      - name: 打包发布包
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\scripts\package-release.ps1

      - name: 安装主流程、复制补丁与语言恢复
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-workflow.ps1

      - name: 旧版长路径与只读属性
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-workflow.ps1 -LegacyLongPaths

      - name: 配置、备份与进程隔离回归
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-regressions.ps1

      - name: 启动器复用与失败传播
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-launcher.ps1

      - name: 无按键安装入口
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-unattended.ps1

      - name: 入口脚本与错误日志
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-bootstrap.ps1

      - name: 隐藏控制台模式
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-console-mode.ps1

      - name: 复制失败与完整性校验
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-copy-failures.ps1

      - name: 自定义安装位置识别
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-discovery.ps1

      - name: 发布包解包回归
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          .\tests\test-release.ps1

      - name: 失败时上传诊断文件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: diagnostics/**
          if-no-files-found: ignore
